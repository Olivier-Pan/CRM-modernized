server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend http://backend:3001;

    # Proxy toutes les requêtes /api vers le backend Rust
    location /api {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Bundles hashés par Vite : JAMAIS de repli sur index.html.
    # Un fichier absent doit renvoyer un vrai 404. Sinon le navigateur reçoit
    # du HTML en « 200 text/html » là où il attend du JavaScript, échoue sur
    # « Unexpected token < », et la page reste blanche — sans la moindre
    # erreur côté serveur, tous les logs affichant 200.
    # NB nginx : un add_header dans un location ANNULE ceux du niveau server,
    # d'où leur répétition ici.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
    }

    # index.html porte les noms de bundles : il doit être revalidé à chaque
    # chargement, sinon un navigateur conserve un index.html qui pointe vers
    # un bundle supprimé au déploiement suivant.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
    }

    # SPA fallback — toutes les routes React Router renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sécurité basique
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
}
